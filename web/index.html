<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>go-frog</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #fff;
    --border: #e0e0e0;
    --text: #222;
    --muted: #888;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 32px 16px;
  }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; }
  h1 span { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 8px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-top: 16px;
  }
  .tabs { display: flex; gap: 0; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 8px 14px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    transition: all .15s;
  }
  .tabs button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .tabs button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .tabs button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .field label small { font-weight: 400; color: var(--muted); }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea {
    width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 4px;
    outline: none; transition: border .15s; font-family: inherit;
  }
  .field input:focus, .field textarea:focus { border-color: var(--blue); }
  .field textarea { resize: vertical; }
  .hint { font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
  .btn-run {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
    background: var(--blue); color: #fff; border: none;
    border-radius: var(--radius); cursor: pointer; transition: opacity .15s;
  }
  .btn-run:hover { opacity: 0.9; }
  .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-run.htmx-request { opacity: 0.6; }

  /* Keyword repeater */
  .kw-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .kw-row input { flex: 1; }
  .kw-remove {
    width: 28px; padding: 0; font-size: 16px; line-height: 1;
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--muted); cursor: pointer; flex-shrink: 0;
  }
  .kw-remove:hover { color: var(--red); border-color: var(--red); }
  .kw-add {
    font-size: 12px; background: none; border: 1px dashed var(--border);
    border-radius: 4px; padding: 4px 10px; cursor: pointer; color: var(--muted);
  }
  .kw-add:hover { border-color: var(--blue); color: var(--blue); }

  /* Job cards */
  #jobs { margin-top: 16px; }
  .job {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  }
  .job-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .job-mode {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    color: var(--muted); letter-spacing: .5px;
  }
  .job-target {
    font-size: 12px; color: var(--muted);
    max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .job-bar {
    height: 5px; background: var(--border); border-radius: 3px; overflow: hidden;
    margin-bottom: 6px;
  }
  .job-fill {
    height: 100%; background: var(--blue); transition: width .3s;
  }
  .job-fill.done { background: var(--green); }
  .job-fill.err { background: var(--red); }
  .job-info {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .job-url {
    max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-dl {
    padding: 4px 12px; font-size: 12px; font-weight: 500;
    background: var(--green); color: #fff; border-radius: 4px;
    text-decoration: none; transition: opacity .15s;
  }
  .btn-dl:hover { opacity: 0.9; }
  .err-text { color: var(--red); }
  [x-cloak] { display: none !important; }
</style>
</head>
<body x-data="{mode: 'spider', keywords: ['']}">
<div class="container">
  <h1>go-frog <span>site crawl &amp; custom search</span></h1>

  <div class="card">
    <form hx-post="/api/crawl"
          hx-encoding="multipart/form-data"
          hx-target="#jobs"
          hx-swap="afterbegin"
          hx-indicator=".btn-run">

      <div class="tabs">
        <button type="button" @click="mode='spider'"
                :class="mode==='spider' && 'active'">🕷 Spider</button>
        <button type="button" @click="mode='list'"
                :class="mode==='list' && 'active'">📋 List</button>
      </div>

      <input type="hidden" name="mode" :value="mode">

      <div class="field" x-show="mode==='spider'">
        <label>Starting URL</label>
        <input type="text" name="startUrl" placeholder="https://example.com" :required="mode==='spider'">
      </div>

      <div class="field" x-show="mode==='list'" x-cloak>
        <label>URLs <small>(one per line)</small></label>
        <textarea name="urls" rows="6" placeholder="https://example.com&#10;https://example.com/about&#10;https://other-site.com" :required="mode==='list'"></textarea>
      </div>

      <div class="field">
        <label>Keywords <small>(optional)</small></label>
        <div class="hint">Counts how many times each keyword appears in the HTML of every crawled page. Results appear as extra columns in the CSV.</div>
        <template x-for="(kw, i) in keywords" :key="i">
          <div class="kw-row">
            <input type="text" x-model="keywords[i]" placeholder="keyword" style="margin-bottom:0">
            <button type="button" class="kw-remove" @click="keywords.splice(i,1)" x-show="keywords.length > 1">&times;</button>
          </div>
        </template>
        <button type="button" class="kw-add" @click="keywords.push('')">+ Add keyword</button>
        <input type="hidden" name="keywords" :value="keywords.filter(k => k.trim()).join('|')">
      </div>

      <div class="field">
        <label>Concurrency</label>
        <input type="number" name="concurrency" value="10" min="1" max="50">
      </div>

      <button type="submit" class="btn-run">Run Crawl</button>
    </form>
  </div>

  <div id="jobs"></div>
</div>
</body>
</html>
