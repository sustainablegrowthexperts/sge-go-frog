services:
  go-frog:
    build: .
    ports:
      - "4374:8080"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      GOFROG_MCP_ENABLED: "${GOFROG_MCP_ENABLED:-false}"
      GOFROG_MCP_PATH: "${GOFROG_MCP_PATH:-/mcp}"
      GOFROG_MCP_JOB_TTL: "${GOFROG_MCP_JOB_TTL:-24h}"
      GOFROG_MCP_RESULTS_DIR: "${GOFROG_MCP_RESULTS_DIR:-/results}"
      GOFROG_MCP_MAX_PAGES: "${GOFROG_MCP_MAX_PAGES:-5000}"
      GOFROG_MCP_MAX_DEPTH: "${GOFROG_MCP_MAX_DEPTH:-10}"
      GOFROG_MCP_MAX_LIST_URLS: "${GOFROG_MCP_MAX_LIST_URLS:-1000}"
      GOFROG_MCP_MAX_DURATION: "${GOFROG_MCP_MAX_DURATION:-30m}"
      GOFROG_MCP_MAX_JOBS: "${GOFROG_MCP_MAX_JOBS:-4}"
      GOFROG_MCP_DEFAULT_ARCHIVE: "${GOFROG_MCP_DEFAULT_ARCHIVE:-false}"
      GOFROG_MCP_ARTIFACT_BASE_URL: "${GOFROG_MCP_ARTIFACT_BASE_URL:-}"
    volumes:
      - ./results:/results
