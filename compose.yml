services:
  go-frog:
    build: .
    ports:
      - "4374:8080"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # The MCP endpoint is disabled unless explicitly enabled. It shares the
      # web listener and must stay behind oauth2-proxy; never publish an
      # unauthenticated MCP listener directly.
      GOFROG_MCP_ENABLED: "${GOFROG_MCP_ENABLED:-false}"
      GOFROG_MCP_PATH: "${GOFROG_MCP_PATH:-/mcp}"
      GOFROG_MCP_JOB_TTL: "${GOFROG_MCP_JOB_TTL:-24h}"
      GOFROG_MCP_RESULTS_DIR: "${GOFROG_MCP_RESULTS_DIR:-/results}"
      # Persist completed jobs under the results volume so they survive a
      # container restart or redeploy for the retention window.
      GOFROG_MCP_PERSIST: "${GOFROG_MCP_PERSIST:-true}"
      GOFROG_MCP_MAX_RETAINED_JOBS: "${GOFROG_MCP_MAX_RETAINED_JOBS:-100}"
      GOFROG_MCP_MAX_PAGES: "${GOFROG_MCP_MAX_PAGES:-5000}"
      GOFROG_MCP_MAX_DEPTH: "${GOFROG_MCP_MAX_DEPTH:-10}"
      GOFROG_MCP_MAX_LIST_URLS: "${GOFROG_MCP_MAX_LIST_URLS:-1000}"
      GOFROG_MCP_MAX_DURATION: "${GOFROG_MCP_MAX_DURATION:-30m}"
      GOFROG_MCP_MAX_JOBS: "${GOFROG_MCP_MAX_JOBS:-4}"
      GOFROG_MCP_MAX_JOBS_PER_TOKEN: "${GOFROG_MCP_MAX_JOBS_PER_TOKEN:-2}"
      GOFROG_MCP_MAX_CONCURRENCY: "${GOFROG_MCP_MAX_CONCURRENCY:-20}"
      GOFROG_MCP_MAX_KEYWORDS: "${GOFROG_MCP_MAX_KEYWORDS:-20}"
      GOFROG_MCP_MAX_KEYWORD_LENGTH: "${GOFROG_MCP_MAX_KEYWORD_LENGTH:-100}"
      GOFROG_MCP_MAX_URL_LENGTH: "${GOFROG_MCP_MAX_URL_LENGTH:-2048}"
      GOFROG_MCP_MAX_REQUEST_BYTES: "${GOFROG_MCP_MAX_REQUEST_BYTES:-1048576}"
      GOFROG_MCP_MAX_RESPONSE_BYTES: "${GOFROG_MCP_MAX_RESPONSE_BYTES:-5242880}"
      GOFROG_MCP_MAX_SEARCH_LIMIT: "${GOFROG_MCP_MAX_SEARCH_LIMIT:-500}"
      GOFROG_MCP_MAX_INLINE_ARTIFACT_BYTES: "${GOFROG_MCP_MAX_INLINE_ARTIFACT_BYTES:-1048576}"
      GOFROG_MCP_RATE_LIMIT: "${GOFROG_MCP_RATE_LIMIT:-60}"
      GOFROG_MCP_DEFAULT_ARCHIVE: "${GOFROG_MCP_DEFAULT_ARCHIVE:-false}"
      GOFROG_MCP_ARTIFACT_BASE_URL: "${GOFROG_MCP_ARTIFACT_BASE_URL:-}"
    volumes:
      - ./results:/results
